<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>1.박스 속성</title>
    
    <style>
        /*코드 6-5*/
        .box{
            border-width: thick;
            border-style: dashed;
            border-color: black;
            /*코드 6-6 둥근 테두리
            border-radius: 20px;*/
            /*border*radius: 왼쪽 위, 오늘쪽 위, 오른쪽 아래, 왼쪽 아래*/
            border-radius: 60px 40px 30px 70px;
        }
    </style>

</head>

<body>
    <h2>2. 박스 테두리</h2>
    
    <div class="box">
        <h1>Loream ipsum dolor sit amet</h1></div>
</body>

</html>
