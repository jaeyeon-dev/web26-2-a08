<!DOCTYPE html>

    <title>3,4제목과 본문 태그의 활용</title>

<body>
    <h1>홍차</h1>
    <hr><!---구분선-->
    <h2>정의</h2>
    <p>홍차는 백차, 녹차, 우롱차보다 더 많이 발효된 차의 일종이다. 동양에서는 찻물의 빛이 붉기 때문에 홍차라고 부르지만, 서양에서는 찻잎의 색깔 때문에 black Tea라고 부른다.</p>
    <br><!--줄바꿈-->
    <h2>등급</h2>
    <p>홍차는 여러 가지로 등급이 매겨진다. 일반적으로 찻잎의 모양에 따른 등급과 가공 상태에 따른 등급을 조합하여 표시한다.</p>
    <p>- 브로큰 페코</p>
    <p>- 브로큰 페코 수숑</p>
    <p>- 브로큰 오렌지 페코 패닝</p>

    <hr>
    <!--띄어쓰기 표시(2번 이상 띄어쓰기 할 때)-->
    <h1>특수   문자   표기</h1>
    <h1>특수&nbsp;&nbsp;&nbsp;문자&nbsp;&nbsp;&nbsp;표기</h1>

    <!--괄호 표시 '<' '>'-->
    <h2>5 &lt; 9</h2>
    <h2>3 &gt; 2</h2>

    <!--& 표시-->
    <h2>5 &amp; 4</h2>
</body>
